name: vnc_system
version: 1.0.0
system:
  - apt-get update && apt-get install -y wget xfce4 xfce4-goodies dbus-x11 libegl1 libegl1-mesa libgles2-mesa libgles2 libglvnd-dev libgl1-mesa-glx libgl1-mesa-dri mesa-utils-extra
  - wget https://github.com/VirtualGL/virtualgl/releases/download/3.1.2/virtualgl_3.1.2_arm64.deb -O /tmp/virtualgl.deb && dpkg -i /tmp/virtualgl.deb && rm /tmp/virtualgl.deb
  - wget https://github.com/TurboVNC/turbovnc/releases/download/3.2.1/turbovnc_3.2.1_arm64.deb -O /tmp/turbovnc.deb && dpkg -i /tmp/turbovnc.deb && rm /tmp/turbovnc.deb && ln -s /opt/TurboVNC/bin/* /usr/local/bin/
user: []
