name: torch
version: 1.0.0
host_dependencies:
  - name: nvidia_driver
    min_version: "535.0"
    required: true
    mode: gpu
    install_hint: Install or upgrade the NVIDIA driver to >= 535.
system: []
user:
  - >-
    set -eu; TORCH_SPEC=torch;
    LOCKED_TORCH_VERSION="${AIRFIELD_DEP_TORCH_VERSION:-${AIRFIELD_TORCH_VERSION:-${TORCH_VERSION:-}}}";
    if [ -n "${LOCKED_TORCH_VERSION}" ]; then TORCH_SPEC="torch==${LOCKED_TORCH_VERSION}"; fi;
    if [ "${TORCH_INSTALL_TARGET:-cpu}" = "gpu" ]; then
    python3 -m pip install --break-system-packages --no-cache-dir "${TORCH_SPEC}" --index-url "https://download.pytorch.org/whl/${TORCH_GPU_WHL_TAG:-cu121}";
    else
    python3 -m pip install --break-system-packages --no-cache-dir "${TORCH_SPEC}" --index-url "https://download.pytorch.org/whl/cpu";
    fi
